<!DOCTYPE html>
<html>

<head>
    <title>Media - Brennan Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css">
    <script src="js/functions.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css" crossorigin="anonymous" />
</head>

<body>
    <header>
        <nav class="main-menu">
            <ul>
                <li><a href="music.html">MUSIC</a></li>
                <li><a href="plays.html">PLAYS & STUFF</a></li>
                <li class="title"><a href="home.html">BRENNAN PROJECTS</a></li>
                <li><a href="words.html">WORDS</a></li>
                <li><a href="media.html">PHOTOS & VIDS</a></li>
            </ul>
        </nav>
    </header>
    <main class="media-page">
        <section class="calendar-live">
        </section>

        <section class="children-in-need">
        </section>

        <section class="gallery">
            <header class="gallery-header">
                <span class="eyebrow">Slide <span id="currentIndex">1</span> / <span id="totalCount">1</span></span>
                <button id="editBtn" class="edit-btn">Edit gallery</button>
            </header>

            <div class="stage">
                <button id="prevBtn" class="nav-arrow nav-arrow--prev" aria-label="Previous image">&#10094;</button>

                <div class="frame">
                    <img id="slideImage" src="" alt="Gallery image" />
                    <p id="emptyState" class="empty-state">No images yet. Unlock editing to add some.</p>
                    <button id="deleteBtn" class="delete-btn" hidden>Remove this image</button>
                </div>

                <button id="nextBtn" class="nav-arrow nav-arrow--next" aria-label="Next image">&#10095;</button>
            </div>

            <div id="dots" class="dots"></div>

            <div id="uploadPanel" class="upload-panel" hidden>
                <label for="fileInput" class="upload-label">
                    <span>Add images</span>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden>
                </label>
                <button id="lockBtn" class="lock-btn">Lock editing</button>
            </div>
        </div>

        <!-- Passcode modal -->
        <div id="modalOverlay" class="modal-overlay" hidden>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <h2 id="modalTitle">Enter edit code</h2>
                <p class="modal-sub">Enter the passcode to add or remove images.</p>
                <input type="password" id="codeInput" class="code-input" placeholder="Passcode" autocomplete="off">
                <p id="codeError" class="code-error" hidden>Incorrect code, try again.</p>
                <div class="modal-actions">
                    <button id="cancelBtn" class="btn btn--ghost">Cancel</button>
                    <button id="submitCodeBtn" class="btn btn--primary">Unlock</button>
                </div>
            </div>
        </section>

        <script src="js/slideshow.js"></script>
    </main>
    <footer>
        <div class="socials">
            <button><a href="https://open.spotify.com/artist/60cqCaV7CsBIbVvu23KjKi?si=qxHJ70bsRy23CakNJ46DcA"><i
                        class="fab fa-spotify"></i></a></button>
            <button><a href="https://youtube.com/channel/UCuj8jt20GqYR8qhkUpVBocQ?si=c8iBtrAI2XR-oI_4"><i
                        class="fab fa-youtube"></i></a></button>
        </div>
    </footer>
</body>

</html>
